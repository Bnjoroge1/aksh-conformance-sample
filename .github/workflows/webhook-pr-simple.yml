name: Webhook PR Simple
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
jobs:
  trigger:
    runs-on: [self-hosted, trigger-e2e]
    steps:
      - name: Log event
        run: |
          echo "EVENT: ${{ github.event_name }}"
          echo "ACTION: ${{ github.event.action }}"
