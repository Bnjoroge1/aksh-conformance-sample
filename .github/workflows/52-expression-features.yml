name: 52-expression-features
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/52-expression-features.yml']

jobs:
  bracket-access:
    runs-on: [self-hosted, f027-test]
    timeout-minutes: 5
    strategy:
      matrix:
        os: [ubuntu-latest]
        include:
          - os: ubuntu-latest
            arch: arm64
    steps:
      # Test 1: Bracket notation on matrix context
      - name: Bracket access on matrix
        run: |
          echo "matrix.os via bracket: ${{ matrix['os'] }}"
          echo "matrix.arch via bracket: ${{ matrix['arch'] }}"
          if [ "${{ matrix['os'] }}" != "ubuntu-latest" ]; then
            echo "FAIL: bracket access on matrix['os']"
            exit 1
          fi
          if [ "${{ matrix['arch'] }}" != "arm64" ]; then
            echo "FAIL: bracket access on matrix['arch']"
            exit 1
          fi
          echo "PASS: bracket notation works"

      # Test 2: fromJSON + wildcard filter (.*) 
      - name: Wildcard filter on fromJSON
        env:
          JSON_DATA: '[{"name":"alpha","v":1},{"name":"beta","v":2},{"name":"gamma","v":3}]'
        run: |
          echo "Names: ${{ join(fromJSON(env.JSON_DATA).*.name, ',') }}"
          RESULT="${{ join(fromJSON(env.JSON_DATA).*.name, ',') }}"
          if [ "$RESULT" != "alpha,beta,gamma" ]; then
            echo "FAIL: wildcard filter got '$RESULT' expected 'alpha,beta,gamma'"
            exit 1
          fi
          echo "PASS: wildcard filter works"

      # Test 3: contains() with array
      - name: Contains with array
        run: |
          RESULT="${{ contains(fromJSON('[\"a\",\"b\",\"c\"]'), 'b') }}"
          echo "contains(['a','b','c'], 'b') = $RESULT"
          if [ "$RESULT" != "true" ]; then
            echo "FAIL: contains() with array"
            exit 1
          fi
          echo "PASS: contains() with array"

      # Test 4: Nested bracket access
      - name: Nested bracket and dot access
        run: |
          DEEP="${{ fromJSON('{\"a\":{\"b\":{\"c\":\"deep\"}}}')['a']['b']['c'] }}"
          echo "Deep bracket: $DEEP"
          if [ "$DEEP" != "deep" ]; then
            echo "FAIL: nested bracket access got '$DEEP'"
            exit 1
          fi
          DOT="${{ fromJSON('{\"a\":{\"b\":{\"c\":\"deep\"}}}').a.b.c }}"
          if [ "$DOT" != "deep" ]; then
            echo "FAIL: nested dot access got '$DOT'"
            exit 1
          fi
          echo "PASS: nested access works"

      # Test 5: hashFiles
      - name: Test hashFiles
        run: |
          mkdir -p /tmp/hashtest
          echo "hello" > /tmp/hashtest/a.txt
          echo "world" > /tmp/hashtest/b.txt

      - name: Verify hashFiles result
        run: |
          HASH="${{ hashFiles('/tmp/hashtest/*.txt') }}"
          echo "hashFiles result: $HASH"
          if [ -z "$HASH" ]; then
            echo "WARN: hashFiles returned empty (may need workspace-relative paths)"
          else
            echo "PASS: hashFiles returned non-empty hash: $HASH"
          fi
