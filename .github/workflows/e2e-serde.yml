name: E2E serde
on: workflow_dispatch

env:
  RUSTUP_HOME: /workspace/.rustup
  CARGO_HOME: /workspace/.cargo
  RUSTUP_TOOLCHAIN: stable

jobs:
  fmt:
    name: Rustfmt
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: serde-rs/serde
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  build:
    name: Build
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: serde-rs/serde
      - uses: dtolnay/rust-toolchain@stable
      - name: Build serde (default)
        run: cd serde && cargo build --features rc
      - name: Build serde (no-default)
        run: cd serde && cargo build --no-default-features

  clippy:
    name: Clippy
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: serde-rs/serde
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Clippy serde
        run: cd serde && cargo clippy --features rc
      - name: Clippy serde_derive
        run: cd serde_derive && cargo clippy

  test:
    name: Test
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: serde-rs/serde
      - uses: dtolnay/rust-toolchain@stable
      - name: Test serde_core
        run: cd serde_core && cargo test --features rc
      - name: Test serde_derive
        run: cd serde_derive && cargo test
